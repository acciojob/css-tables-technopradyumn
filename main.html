
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <style>
        
body {
    font-family: "Times New Roman", serif;
}

table {
    border-spacing: 4px;
    border-collapse: separate;
}

th, td {
    border: 2px solid #ccc;
    border-radius: 11px;
    padding: 16px;
    text-align: left;
    font-size: 32px;
    min-width: 210px;
}

th {
    font-weight: bold;
    background-color: white;
}

td {
    font-weight: normal;
}

tr:nth-child(even) td {
    background-color: #f2f2f2;
}

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Table-Header 1</th>
                <th>Table-Header 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Cell 1</td>
                <td>Cell 2</td>
            </tr>
            <tr>
                <td>Cell 4</td>
                <td>Cell 5</td>
            </tr>
            <tr>
                <td>Cell 7</td>
                <td>Cell 8</td>
            </tr>
            <tr>
                <td>Cell 9</td>
                <td>Cell 10</td>
            </tr>
        </tbody>
    </table>

    <script type="text/javascript" src="./script.js"></script>
</body>
</html>
